<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Theme flash guard: resolves and applies the light/dark class on
      <html> synchronously, before any CSS/paint, so there is no
      flash-of-wrong-theme while React (see src/lib/theme.tsx) mounts.
      Kept in perfect sync with that module's own resolution logic —
      update both together if the storage key or fallback ever changes.
    -->
    <script>
      (function () {
        try {
          var KEY = 'ashivam-theme';
          var stored = window.localStorage.getItem(KEY);
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode;
          var root = document.documentElement;
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <meta name="theme-color" content="#0B1120" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect + fonts: Fraunces (display), Inter (body), JetBrains Mono (data labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Ashivam Technologies — Building Technology. Creating Possibilities.</title>
    <meta
      name="description"
      content="Ashivam Technologies designs and builds custom software, web and mobile applications, ERP systems, and AI-driven automation for growing businesses."
    />
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
